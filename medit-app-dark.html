      <div class="row"><div class="k">발행일</div><div>${formatDate(rx.issuedAt)}</div></div>
      <div class="row"><div class="k">Rx ID</div><div style="font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace;">#${rx.id.toUpperCase()}</div></div>
      ${rx.drugs.map(d => `<div class="drug"><strong>${esc(d.name)}</strong><br>${esc(d.dosage)} · ${d.duration}일분</div>`).join('')}

        ${esc(state.pharmacy.name)} · ${esc(state.pharmacy.phone)}<br>
        조제 약사: ${esc(cp ? cp.name : state.pharmacist.name)} · 조제일 ${formatDate(new Date().toISOString())}
      </div>
    </div>
  `;
  doPrint(html);
  logAudit('print', 'prescription', rx.id, `조제 라벨 인쇄`);
}

function printPatientGuide(pid) {
  const p = getPatient(pid);
  if (!p) return;
  const activeRxs = state.prescriptions.filter(r => r.patientId === pid && (r.status === 'completed' || r.status === 'dispensing') && (Date.now() - new Date(r.issuedAt).getTime()) < 90 * 86400000);
  const cp = currentPharmacist();
  const allWarnings = [];
  activeRxs.forEach(rx => checkInteractions(rx.drugs).forEach(w => allWarnings.push(w)));

  const html = `
    <div class="print-guide">
      <h1>복약 안내문</h1>
      <div class="meta">
        <div><strong>환자</strong>${esc(p.name)} · ${p.gender} · ${p.age}세</div>
        <div><strong>연락처</strong>${esc(p.phone)}</div>
        <div><strong>발행 약국</strong>${esc(state.pharmacy.name)}</div>
        <div><strong>발행일</strong>${formatDate(new Date().toISOString())}</div>
      </div>

      <h2>현재 복약 중인 약품</h2>
      ${activeRxs.length > 0 ? `<table>
        <thead><tr><th>약품</th><th>용법</th><th>기간</th><th>처방의</th></tr></thead>
        <tbody>${activeRxs.flatMap(rx => rx.drugs.map(d => `<tr>
          <td><strong>${esc(d.name)}</strong></td>
          <td>${esc(d.dosage)}</td>
          <td>${d.duration}일</td>
          <td>${esc(rx.issuedBy)} / ${esc(rx.doctor)}</td>
        </tr>`)).join('')}</tbody>
      </table>` : '<p style="font-size: 13px; color: var(--ink-muted);">현재 복약 중인 약품이 없습니다.</p>'}

      ${allWarnings.length > 0 ? `<h2>복약 시 주의사항</h2>
      ${allWarnings.map(w => `<div class="notice ${w.severity === 'high' ? 'warn' : ''}">
        <strong>${w.severity === 'high' ? '⚠ 상호작용 경고' : '주의'}</strong> — ${esc(w.drugs.join(' + '))}<br>
        ${esc(w.msg)}
      </div>`).join('')}` : ''}

      <h2>일반 복약 수칙</h2>
      <div class="notice">
        <strong>정시 복용</strong> — 처방된 용법·용량을 임의로 변경하지 마세요. 복용을 잊은 경우, 다음 복용 시간이 가까우면 한 번의 복용을 건너뛰고 평소대로 복용합니다.<br>
        <strong>보관</strong> — 직사광선을 피하고 습기 없는 서늘한 곳에 보관하세요. 유아 손이 닿지 않는 곳에 두세요.<br>
        <strong>이상 반응</strong> — 피부 발진, 호흡곤란, 심한 구토 등이 있을 경우 즉시 복용을 중단하고 약국 또는 병원에 연락하세요.
      </div>

      <div class="footer">
        <div>${esc(state.pharmacy.name)} · ${esc(state.pharmacy.address)}<br>TEL ${esc(state.pharmacy.phone)}</div>
        <div>담당 약사: ${esc(cp ? cp.name : state.pharmacist.name)}<br>${esc(cp ? cp.license : state.pharmacist.license)}</div>
      </div>
    </div>
  `;
  doPrint(html);
  logAudit('print', 'patient', pid, `${p.name} 복약 안내문 인쇄`);
}

function printDailyReport() {
  const todayStr = today();
  const todayRx = state.prescriptions.filter(r => r.issuedAt === todayStr);
  const completedToday = todayRx.filter(r => r.status === 'completed');
  const todayNotif = state.notificationLog.filter(n => n.sentAt && n.sentAt.startsWith(todayStr));
  const todayAdh = state.adherenceLog.filter(a => a.scheduledAt.startsWith(todayStr));
  const taken = todayAdh.filter(a => a.status === 'taken').length;
  const missed = todayAdh.filter(a => a.status === 'missed').length;
  const adherenceRate = todayAdh.length > 0 ? Math.round(taken / todayAdh.length * 100) : 0;
  const cp = currentPharmacist();

  const html = `
    <div class="print-report">
      <div class="report-head">
        <div>
          <h1>일일 운영 리포트</h1>
          <div style="font-size: 13px; color: var(--ink-muted); margin-top: 4px;">${esc(state.pharmacy.name)}</div>
        </div>
        <div class="meta">
          <div style="font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 14px; color: var(--green-mid);">${formatDate(todayStr)}</div>
          <div>발행 약사: ${esc(cp ? cp.name : state.pharmacist.name)}</div>
          <div>출력 시각: ${formatTime(new Date().toISOString())}</div>
        </div>
      </div>

      <div class="summary">
        <div class="summary-item"><div class="label">오늘 처방</div><div class="value">${todayRx.length}</div></div>
        <div class="summary-item"><div class="label">조제 완료</div><div class="value">${completedToday.length}</div></div>
        <div class="summary-item"><div class="label">알림 발송</div><div class="value">${todayNotif.length}</div></div>
        <div class="summary-item"><div class="label">복약 준수율</div><div class="value">${adherenceRate}<span style="font-size: 14px;">%</span></div></div>
      </div>

      <h2 style="font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-size: 22px; margin: 0 0 12px; color: var(--green-mid);">오늘의 처방 (${todayRx.length}건)</h2>
      ${todayRx.length > 0 ? `<table>
        <thead><tr><th>Rx ID</th><th>환자</th><th>약품</th><th>발행처</th><th>상태</th></tr></thead>
        <tbody>${todayRx.map(rx => {
          const p = getPatient(rx.patientId);
          const drugs = rx.drugs.map(d => d.name).join(', ');
          const status = rx.status === 'completed' ? '완료' : rx.status === 'pending' ? '대기' : rx.status === 'dispensing' ? '조제중' : rx.status;
          return `<tr><td>#${rx.id.toUpperCase()}</td><td>${esc(p ? p.name : '—')}</td><td>${esc(drugs)}</td><td>${esc(rx.issuedBy)}</td><td>${status}</td></tr>`;
        }).join('')}</tbody>
      </table>` : '<p style="color: var(--ink-muted); font-size: 12px;">없음</p>'}

      <h2 style="font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-size: 22px; margin: 16px 0 12px; color: var(--green-mid);">복약 체크 요약</h2>
      <table>
        <thead><tr><th>구분</th><th>건수</th><th>비율</th></tr></thead>
        <tbody>
          <tr><td>복용 완료</td><td>${taken}</td><td>${todayAdh.length > 0 ? Math.round(taken / todayAdh.length * 100) : 0}%</td></tr>
          <tr><td>누락</td><td>${missed}</td><td>${todayAdh.length > 0 ? Math.round(missed / todayAdh.length * 100) : 0}%</td></tr>
          <tr><td>총 스케줄</td><td>${todayAdh.length}</td><td>100%</td></tr>
        </tbody>
      </table>

      <div style="margin-top: 30px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--ink-muted); text-align: center;">
        ${esc(state.pharmacy.name)} · ${esc(state.pharmacy.address)} · TEL ${esc(state.pharmacy.phone)}<br>
        본 리포트는 MedIT 약국 관리 시스템에서 자동 생성되었습니다.
      </div>
    </div>
  `;
  doPrint(html);
  logAudit('print', 'report', todayStr, `일일 운영 리포트 인쇄`);
}

/* ====================================================
   LOGIN / LOGOUT
   ==================================================== */
function showLogin() {
  $('#login-screen').classList.remove('hidden');
  $('#main-app').style.display = 'none';
  setTimeout(() => $('#login-username').focus(), 100);
}
function hideLogin() {
  $('#login-screen').classList.add('hidden');
  $('#main-app').style.display = '';
}
function attemptLogin() {
  const username = $('#login-username').value.trim();
  const password = $('#login-password').value;
  if (!username || !password) return toast('아이디와 비밀번호를 입력하세요', 'error');
  const ph = state.pharmacists.find(p => p.username === username);
  if (!ph || ph.passHash !== hashPass(password)) {
    logAudit('login-fail', 'auth', null, `실패 시도 · username=${username}`);
    saveState();
    return toast('아이디 또는 비밀번호가 올바르지 않습니다', 'error');
  }
  state.session = { pharmacistId: ph.id, loginAt: new Date().toISOString() };
  logAudit('login', 'auth', ph.id, `${ph.name} 로그인`);
  saveState();
  hideLogin();
  render();
  toast(`${ph.name} 약사님, 환영합니다`, 'success');
}
function logout() {
  const cp = currentPharmacist();
  if (cp) logAudit('logout', 'auth', cp.id, `${cp.name} 로그아웃`);
  state.session = null;
  saveState();
  $('#login-username').value = '';
  $('#login-password').value = '';
  showLogin();
}

function init() {
  state = loadState();

  // Login screen bindings
  $('#login-submit').addEventListener('click', attemptLogin);
  $('#login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
  $('#login-username').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#login-password').focus(); });

  // Bind logout button
  const logoutBtn = $('#btn-logout-mobile');
  if (logoutBtn) logoutBtn.addEventListener('click', logout);

  // Bottom bar tabs are bound inline via onclick

  // If no active session, show login
  if (!state.session || !currentPharmacist()) {
    showLogin();
    return;
  }

  hideLogin();

  const hashView = location.hash.replace('#/', '');
  if (hashView && ['dashboard', 'prescriptions', 'patients', 'monitoring', 'notifications', 'pharmacists', 'audit', 'settings'].includes(hashView)) {
    navigate(hashView);
  } else {
    render();
  }
}

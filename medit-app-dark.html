<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedIT — 복약 관리 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
@font-face{font-family:'HCR Dotum';font-style:normal;font-weight:700;font-display:swap;src:url('HANDotumB.ttf') format('truetype')}
  :root {
    --bg: #0a0e12;
    --bg-main: #0d1117;
    --surface: rgba(255,255,255,0.04);
    --surface-alt: rgba(255,255,255,0.06);
    --ink: #e8ecef;
    --ink-soft: #c0c8d0;
    --ink-muted: #7a8694;
    --line: rgba(255,255,255,0.08);
    --line-strong: rgba(255,255,255,0.15);
    --green: #0a1218;
    --green-mid: #00d2b4;
    --green-soft: #00d2b4;
    --green-lighter: rgba(0,210,180,0.1);
    --accent: #00d2b4;
    --accent-soft: rgba(0,210,180,0.15);
    --yellow: #7df3ff;
    --yellow-soft: rgba(125,243,255,0.12);
    --red: #ff6b6b;
    --red-soft: rgba(255,107,107,0.12);
    --blue: #b4a0ff;
    --blue-soft: rgba(180,160,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'HCR Dotum', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    letter-spacing: -0.005em;
    font-size: 16px;
    overflow-x: hidden;
  }
  body::after {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 500;
    opacity: 0.015; mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; color: inherit; }

  /* =============== MEDICATION GUIDANCE CARDS =============== */
  .med-card {
    width: 300px; height: 300px; margin: 0 auto 16px;
    background: #f7f4ee; color: #2a2520; border: none;
    font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif;
    padding: 28px; position: relative; overflow: hidden;
    user-select: text; -webkit-user-select: text; cursor: text;
    border-radius: 2px; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .med-card * { user-select: text; -webkit-user-select: text; }
  .med-card .mc-label {
    font-size: 10px; letter-spacing: 0.3em; color: #a09888;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .med-card .mc-name {
    font-size: 22px; font-weight: 400; line-height: 1.3;
    color: #1a1610; margin-bottom: 2px; word-break: keep-all;
  }
  .med-card .mc-dose {
    font-size: 13px; color: #6b6155; line-height: 1.6; margin-top: 6px;
  }
  .med-card .mc-warn {
    font-size: 11px; color: #99544a; line-height: 1.6; margin-top: auto;
    padding-top: 12px; border-top: 1px solid #e0dbd2;
  }
  .med-card .mc-footer {
    font-size: 9px; color: #b8b0a4; letter-spacing: 0.15em;
    margin-top: 10px; text-align: right;
  }
  .med-card .mc-line {
    width: 24px; height: 1px; background: #ccc5b8; margin: 8px 0;
  }
  .med-card-actions {
    display: flex; gap: 8px; justify-content: center; margin-bottom: 16px;
  }
  .med-card-actions button {
    padding: 8px 16px; border-radius: 6px; font-size: 12px;
    border: 1px solid var(--line); background: var(--surface);
    color: var(--ink-soft); cursor: pointer; font-family: inherit;
  }
  .med-card-actions button:active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .med-cards-scroll {
    display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 4px 0 16px; -webkit-overflow-scrolling: touch;
  }
  .med-cards-scroll::-webkit-scrollbar { display: none; }
  .med-cards-scroll .med-card { scroll-snap-align: center; flex-shrink: 0; }

  /* =============== MOBILE 3.0 LAYOUT =============== */
  .app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }

  .sidebar { display: none; }

  .mobile-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .mobile-header .logo { font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -.01em; }
  .mobile-header .logo span { color: var(--ink); font-weight: 500; }
  .mobile-header .user-pill {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 99px; font-size: 13px; color: var(--ink-soft);
  }
  .mobile-header .user-pill .dot { width: 6px; height: 6px; background: #2a9d5f; border-radius: 50%; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: var(--bg); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    display: flex; justify-content: space-around; align-items: stretch;
    padding: 4px 0; padding-bottom: max(4px, env(safe-area-inset-bottom));
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 0; background: none; border: none; color: var(--ink-muted);
    font-size: 13px; font-weight: 500; cursor: pointer; position: relative; transition: color .2s;
    font-family: 'HCR Dotum', 'Noto Sans KR', sans-serif;
  }
  .tab-btn svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.5; fill: none; }
  .tab-btn.active { color: var(--accent); }
  .tab-btn .tab-badge {
    position: absolute; top: 2px; right: calc(50% - 18px);
    background: var(--red); color: white; font-size: 10px; font-weight: 600;
    min-width: 14px; height: 14px; border-radius: 99px; display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace;
  }

  .more-sheet {
    display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.5);
  }
  .more-sheet.open { display: flex; align-items: flex-end; }
  .more-sheet-inner {
    width: 100%; background: var(--bg); border-radius: 20px 20px 0 0;
    padding: 8px 0 max(16px, env(safe-area-inset-bottom));
    max-height: 60vh; overflow-y: auto;
  }
  .more-sheet-inner .handle { width: 36px; height: 4px; background: var(--line-strong); border-radius: 2px; margin: 4px auto 12px; }
  .more-item {
    display: flex; align-items: center; gap: 16px; padding: 16px 22px;
    background: none; border: none; width: 100%; text-align: left;
    font-size: 16px; color: var(--ink); cursor: pointer; font-family: inherit;
  }
  .more-item:active { background: var(--surface); }
  .more-item svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; color: var(--ink-muted); }
  .more-item .mi-badge { margin-left: auto; background: var(--accent); color: var(--bg); font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
  .more-item.danger { color: var(--red); }
  .more-item.danger svg { color: var(--red); }

  .main { min-width: 0; display: flex; flex-direction: column; flex: 1; }
  .topbar { display: none; }
  .breadcrumb { display: none; }
  .topbar-right { display: none; }
  .search-box { display: none; }
  .pharmacy-tag { display: none; }

  .content { padding: 18px; padding-bottom: 90px; width: 100%; }

  .sidebar-brand, .sidebar-section, .sidebar-footer, .user-card, .user-avatar, .user-info, .nav-item { display: none; }

  .page-header { display: flex; flex-direction: column; align-items: stretch; margin-bottom: 20px; gap: 12px; }
  .page-header .title { font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.05; letter-spacing: -.03em; color: var(--ink); }
  .page-header .title em { font-style: normal; font-weight: 700; color: var(--accent); }
  .page-header .subtitle { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; letter-spacing: .2em; color: var(--ink-muted); text-transform: uppercase; margin-bottom: 10px; }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Buttons */
  .btn { padding: 9px 16px; border-radius: 4px; font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
  .btn:hover { background: var(--surface-alt); }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: #00b89e; border-color: #00b89e; }
  .btn.danger { background: transparent; color: var(--red); border-color: var(--red); }
  .btn.danger:hover { background: var(--red); color: var(--bg); }
  .btn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 1.7; fill: none; }

  .date-selector { display: flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: var(--surface); }
  .date-selector button { background: transparent; border: none; padding: 8px 14px; font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; letter-spacing: .08em; color: var(--ink-soft); border-right: 1px solid var(--line); text-transform: uppercase; }
  .date-selector button:last-child { border-right: none; }
  .date-selector button.active { background: var(--green); color: var(--bg); }
  .date-selector button:not(.active):hover { background: var(--surface-alt); }

  /* KPI */
  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); margin-bottom: 24px; }
  .kpi { padding: 22px 26px; border-right: 1px solid var(--line); transition: background .3s; }
  .kpi:last-child { border-right: none; }
  .kpi:hover { background: var(--surface-alt); }
  .kpi-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .kpi-label { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; letter-spacing: .18em; color: var(--ink-muted); text-transform: uppercase; }
  .kpi-delta { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; padding: 2px 7px; border-radius: 3px; font-weight: 500; }
  .kpi-delta.up { background: var(--green-lighter); color: var(--accent); }
  .kpi-delta.down { background: var(--red-soft); color: var(--red); }
  .kpi-delta.neutral { background: var(--surface-alt); color: var(--ink-muted); }
  .kpi-value { font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-size: 32px; line-height: 1; color: var(--ink); letter-spacing: -.03em; margin-bottom: 4px; }
  .kpi-value .unit { font-family: 'HCR Dotum', 'Noto Sans KR', sans-serif; font-size: 14px; color: var(--ink-muted); margin-left: 4px; }
  .kpi-sub { font-size: 12px; color: var(--ink-muted); }

  /* Grids */
  .dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .dash-grid-even { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* Card */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card-header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-title { font-size: 14px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 10px; }
  .card-title .code { font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-style: normal; font-weight: 700; font-size: 20px; color: var(--accent); line-height: 1; }
  .card-title .count { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; background: var(--bg); color: var(--ink-muted); padding: 2px 7px; border-radius: 3px; border: 1px solid var(--line); letter-spacing: .05em; }
  .card-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tab-group { display: flex; gap: 0; }
  .tab { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; background: transparent; border: none; color: var(--ink-muted); border-bottom: 1px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab:hover:not(.active) { color: var(--ink-soft); }
  .card-body { padding: 0; }
  .card-body.padded { padding: 20px 24px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 10px 16px; background: var(--surface-alt); font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; letter-spacing: .15em; color: var(--ink-muted); text-transform: uppercase; font-weight: 500; border-bottom: 1px solid var(--line); }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--ink); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .15s; cursor: pointer; }
  tbody tr:hover { background: var(--surface-alt); }
  tbody td.mono { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; color: var(--ink-soft); }
  tbody td.name { font-weight: 500; }
  tbody td .sub-line { display: block; font-size: 13px; color: var(--ink-muted); margin-top: 2px; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; padding: 3px 8px; border-radius: 100px; letter-spacing: .08em; font-weight: 500; text-transform: uppercase; border: 1px solid transparent; }
  .pill.green { background: var(--green-lighter); color: var(--accent); border-color: rgba(0,210,180,0.1); }
  .pill.yellow { background: var(--yellow-soft); color: #8a6a14; border-color: rgba(138,106,20,.2); }
  .pill.red { background: var(--red-soft); color: var(--red); border-color: rgba(166,61,43,.18); }
  .pill.blue { background: var(--blue-soft); color: var(--blue); border-color: rgba(52,90,122,.18); }
  .pill.gray { background: var(--surface-alt); color: var(--ink-muted); border-color: var(--line); }
  .pill .status-dot { width: 5px; height: 5px; background: currentColor; border-radius: 50%; }
  .pill.green .status-dot { background: #2a9d5f; }

  .row-action { background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; letter-spacing: .1em; color: var(--ink-soft); text-transform: uppercase; transition: all .2s; }
  .row-action:hover { background: var(--green); color: var(--bg); border-color: var(--accent); }
  .row-action.danger:hover { background: var(--red); border-color: var(--red); }

  /* Channel status */
  .channel-block { padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .channel-block:last-child { border-bottom: none; }
  .ch-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .ch-name { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; }
  .ch-name .ch-num { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; color: var(--ink-muted); letter-spacing: .1em; }
  .ch-icon { width: 26px; height: 26px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-style: normal; font-weight: 700; font-size: 14px; line-height: 1; }
  .ch-icon.kakao { background: #FEE500; color: #1a1a1a; }
  .ch-icon.sms { background: var(--blue-soft); color: var(--blue); }
  .ch-icon.voice { background: var(--accent-soft); color: var(--accent); }
  .ch-meta { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; color: var(--ink-muted); }
  .ch-progress { height: 6px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
  .ch-progress-bar { height: 100%; border-radius: 3px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .ch-progress-bar.kakao { background: #FEE500; }
  .ch-progress-bar.sms { background: var(--blue); }
  .ch-progress-bar.voice { background: var(--accent); }
  .ch-stats { display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; color: var(--ink-muted); }
  .ch-stats strong { color: var(--ink); font-weight: 500; }

  /* Chart */
  .chart-wrap { padding: 20px 24px 28px; }
  .chart-legend { display: flex; gap: 18px; margin-bottom: 16px; font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 12px; letter-spacing: .1em; color: var(--ink-muted); text-transform: uppercase; align-items: center; flex-wrap: wrap; }
  .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .dot { width: 9px; height: 9px; border-radius: 2px; }
  .chart-legend .dot.taken { background: var(--green); }
  .chart-legend .dot.missed { background: var(--accent); }
  .chart-legend .dot.partial { background: var(--yellow); }
  .chart-svg { width: 100%; height: 220px; }

  /* At-risk */
  .risk-item { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; padding: 14px 24px; border-bottom: 1px solid var(--line); align-items: center; transition: background .15s; }
  .risk-item:last-child { border-bottom: none; }
  .risk-item:hover { background: var(--surface-alt); }
  .risk-avatar { width: 36px; height: 36px; background: var(--green-lighter); color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'HCR Dotum', 'HCR Dotum', 'Noto Sans KR', sans-serif; font-style: normal; font-weight: 700; font-size: 16px; border: 1px solid rgba(0,210,180,0.08); }
  .risk-avatar.high { background: var(--red-soft); color: var(--red); border-color: rgba(166,61,43,.2); }
  .risk-avatar.mid { background: var(--yellow-soft); color: #8a6a14; border-color: rgba(138,106,20,.2); }
  .risk-info .name { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 2px; }
  .risk-info .meta { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 10.5px; color: var(--ink-muted); letter-spacing: .05em; }
  .risk-score { text-align: right; }
  .risk-score .val { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 14px; font-weight: 500; color: var(--ink); }
  .risk-score .val.high { color: var(--red); }
  .risk-score .val.mid { color: #8a6a14; }
  .risk-score .label { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 11px; color: var(--ink-muted); letter-spacing: .12em; text-transform: uppercase; }

  /* Activity */
  .activity { padding: 14px 24px; display: grid; grid-template-columns: 72px 1fr; gap: 14px; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .activity:last-child { border-bottom: none; }
  .activity-time { font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 13px; color: var(--ink-muted); padding-top: 2px; }
  .activity-time .sub { display: block; font-size: 11px; margin-top: 2px; opacity: .7; }
  .activity-content { font-size: 13px; line-height: 1.5; color: var(--ink); }
  .activity-content .type { display: inline-block; font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; font-size: 11px; padding: 2px 6px; border-radius: 3px; letter-spacing: .1em; text-transform: uppercase; margin-right: 8px; vertical-align: 1px; }
  .type.rx { background: var(--green-lighter); color: var(--accent); }
  .type.alert { background: var(--yellow-soft); color: #8a6a14; }
  .type.sent { background: var(--blue-soft); color: var(--blue); }
  .type.sync { background: var(--surface-alt); color: var(--ink-muted); border: 1px solid var(--line); }
  .activity-content strong { font-weight: 500; color: var(--ink); }
  .activity-content .link { color: var(--accent); text-decoration: underline; text-decoration-color: rgba(0,210,180,0.2); text-underline-offset: 2px; cursor: pointer; }
  .activity-content .link:hover { text-decoration-color: var(--accent); }

  /* =============== MODAL =============== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(22, 26, 23, 0.4); backdrop-filter: blur(3px); z-index: 1000; display: flex; align-items: flex-start; justify-content: center; padding: 60px 20px 20px; opacity: 0; pointer-events: none; transition: opacity .25s; overflow-y: auto; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  const warnings = [];

/* ---------- Auth ---------- */
function hashPass(pw) {
  // Simple hash — NOT production-grade. Use bcrypt/argon2 via backend in production.
  let h = 0;
  for (let i = 0; i < pw.length; i++) { h = ((h << 5) - h) + pw.charCodeAt(i); h = h & h; }
  return 'h' + Math.abs(h).toString(36) + '_' + pw.length;
}
function currentPharmacist() {
  if (!state.session) return null;
  return state.pharmacists.find(p => p.id === state.session.pharmacistId) || null;
}
function requireRole(role) {
  const cp = currentPharmacist();
  if (!cp) return false;
  if (role === 'admin') return cp.role === 'admin';
  return true;
}

/* ---------- Audit Log ---------- */
function logAudit(action, target, targetId, details = '') {
  const cp = currentPharmacist();
  state.auditLog.push({
    id: uid(),
    pharmacistId: cp ? cp.id : null,
    pharmacistName: cp ? cp.name : 'SYSTEM',
    action, target, targetId, details,
    timestamp: new Date().toISOString(),
  });
  // Keep last 2000 audit entries only
  if (state.auditLog.length > 2000) state.auditLog = state.auditLog.slice(-2000);
}

/* ---------- State / Storage ---------- */
const KEY = 'medit.v04';
let state = null;

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Auto-migrate v0.4 -> v0.5
      if (parsed.version === '0.4') {
        parsed.version = '0.5';
        parsed.pharmacists = [
          { id: 'ph1', username: 'admin', passHash: hashPass('0000'), name: parsed.pharmacist?.name || '김수진', license: parsed.pharmacist?.license || '', role: 'admin', createdAt: new Date().toISOString().split('T')[0] },
        ];
        parsed.session = null;
        parsed.auditLog = [];
        parsed.pairings = [];
        return parsed;
      }
      if (parsed.version === '0.5') return parsed;
    }
  } catch (e) {}
  return seedData();
}
function saveState() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    toast('저장 실패: 저장 공간 부족', 'error');
  }
}
function resetState() {
  state = seedData();
  saveState();
  render();
  toast('데모 데이터로 초기화되었습니다', 'success');
}

/* ---------- Helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => 'x' + Math.random().toString(36).slice(2, 10);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().split('T')[0];
const formatDate = (d) => d ? new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\. /g, '.').replace('.', '') : '—';
const formatTime = (d) => d ? new Date(d).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }) : '—';
const ago = (d) => {
  if (!d) return '';
  const diff = Date.now() - new Date(d).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  if (m < 1440) return Math.floor(m / 60) + '시간 전';
  return Math.floor(m / 1440) + '일 전';
};
const getPatient = (id) => state.patients.find(p => p.id === id);
const getRx = (id) => state.prescriptions.find(r => r.id === id);

/* ---------- Toast ---------- */
function toast(msg, type = 'default') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const icons = {
    success: '<svg viewBox="0 0 24 24"><path d="M4 12 L10 18 L20 6"/></svg>',
    error: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8 L12 13 M12 16 L12 17"/></svg>',
    warning: '<svg viewBox="0 0 24 24"><path d="M12 3 L22 20 L2 20 Z M12 10 L12 15 M12 17 L12 18"/></svg>',
    default: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7 L12 13 M12 16 L12 17"/></svg>',
  };
  el.innerHTML = (icons[type] || icons.default) + '<span>' + esc(msg) + '</span>';
  $('#toast-stack').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'all .3s'; }, 3200);
  setTimeout(() => el.remove(), 3600);
}

/* ---------- Modal ---------- */
let modalCleanup = null;
function openModal(html, wide = false, onOpen = null) {
  const modal = $('#modal');
  modal.classList.toggle('wide', !!wide);
  modal.innerHTML = html;
  $('#modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (onOpen) onOpen(modal);
  const closers = $$('[data-close]', modal);
  closers.forEach(c => c.addEventListener('click', closeModal));
}
function closeModal() {
  $('#modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  if (modalCleanup) { modalCleanup(); modalCleanup = null; }
}
$('#modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function confirmDialog(title, message, onConfirm, confirmLabel = '삭제', danger = true) {
  openModal(`
    <div class="confirm">
      <div class="icon-box"><svg viewBox="0 0 24 24"><path d="M12 3 L22 20 L2 20 Z M12 10 L12 15 M12 17 L12 18"/></svg></div>
      <h3>${esc(title)}</h3>
      <p>${esc(message)}</p>
    </div>
    <div class="modal-footer">
      <button class="btn" data-close>취소</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" id="confirm-yes">${esc(confirmLabel)}</button>
    </div>
  `);
  $('#confirm-yes').addEventListener('click', () => { closeModal(); onConfirm(); });
}

/* ---------- Router ---------- */
let currentView = 'dashboard';
function navigate(view) {
  currentView = view;
  $$('[data-view]').forEach(el => el.classList.toggle('active', el.getAttribute('data-view') === view));
  // Update bottom bar active state
  const tabMap = { dashboard: 0, patients: 1, monitoring: 2, notifications: 3 };
  $$('.tab-btn').forEach((btn, i) => btn.classList.toggle('active', tabMap[view] === i));
  try { history.replaceState(null, '', '#/' + view); } catch(e) {}
  render();
}

function toggleMoreSheet() { document.getElementById('more-sheet').classList.add('open'); }
function closeMoreSheet() { document.getElementById('more-sheet').classList.remove('open'); }
window.toggleMoreSheet = toggleMoreSheet;
window.closeMoreSheet = closeMoreSheet;

/* ---------- Views ---------- */
function render() {
  renderChrome();
  renderDashboard();
  renderPrescriptions();
  renderPatients();
  renderMonitoring();
  renderNotifications();
  renderDelivery();
  renderSideEffects();
  renderPOSBridge();
  renderPharmacyFinder();
  renderRxRouting();
  renderPharmacists();
  renderAudit();
  renderSettings();
}

function renderChrome() {
  const cp = currentPharmacist();
  const nameEl = $('#user-name');
  if (nameEl) nameEl.textContent = cp ? cp.name + ' 약사' : '—';
  const pillEl = $('#user-pill');
  if (pillEl) pillEl.style.display = cp ? '' : 'none';
  // Update role display
  const roleEl = $('.user-info .role');
  if (roleEl) roleEl.textContent = cp ? (cp.role === 'admin' ? 'ADMIN · ' : 'PHARMACIST · ') + (cp.license || '').replace('약사면허 ', '') : '';
  const pending = state.prescriptions.filter(r => r.status === 'pending' || r.status === 'dispensing').length;
  const rxBadge = $('#nav-rx-count'); if (rxBadge) rxBadge.textContent = pending;
  const todayStr = today();
  const missed = state.adherenceLog.filter(a => a.scheduledAt.startsWith(todayStr) && a.status === 'missed').length;
  const monBadge = $('#nav-mon-count'); if (monBadge) monBadge.textContent = missed;
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const view = $('#view-dashboard');
  const todayStr = today();
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

  const todayRx = state.prescriptions.filter(r => r.issuedAt === todayStr).length;
  const yestRx = state.prescriptions.filter(r => r.issuedAt === yesterday).length;
  const rxDelta = yestRx > 0 ? Math.round((todayRx - yestRx) / yestRx * 100) : 0;

  const activePatients = state.patients.length;

  // Adherence last 7 days
  const last7 = state.adherenceLog.filter(a => {
    const d = new Date(a.scheduledAt).getTime();
    return Date.now() - d < 7 * 86400000;
  });
  const taken = last7.filter(a => a.status === 'taken').length;
  const adherence = last7.length > 0 ? Math.round(taken / last7.length * 1000) / 10 : 0;

  const todayNotif = state.notificationLog.filter(n => n.sentAt && n.sentAt.startsWith(todayStr));
  const sentOk = todayNotif.filter(n => n.status === 'sent').length;
  const notifSuccess = todayNotif.length > 0 ? Math.round(sentOk / todayNotif.length * 1000) / 10 : 0;

  // Channel stats (today)
  const chStats = {};
  ['kakao', 'sms', 'voice'].forEach(ch => {
    const all = todayNotif.filter(n => n.channel === ch);
    const ok = all.filter(n => n.status === 'sent').length;
    chStats[ch] = { sent: all.length, ok, failed: all.length - ok, pct: all.length > 0 ? Math.round(ok / all.length * 100) : 0 };
  });

  // At-risk patients
  const atRisk = state.patients.map(p => {
    const logs = state.adherenceLog.filter(a => a.patientId === p.id);
    const recent = logs.filter(a => (Date.now() - new Date(a.scheduledAt).getTime()) < 7 * 86400000);
    const recTaken = recent.filter(a => a.status === 'taken').length;
    const rate = recent.length > 0 ? Math.round(recTaken / recent.length * 100) : 100;
    return { p, rate, recent: recent.length };
  }).filter(x => x.rate < 80).sort((a, b) => a.rate - b.rate);

  // Bars data - last 14 days aggregated
  const barsData = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const ds = d.toISOString().split('T')[0];
    const day = state.adherenceLog.filter(a => a.scheduledAt.startsWith(ds));

    const p = day.filter(a => a.status === 'partial').length;

function renderChannelBlock(key, label, num, stats) {
  const pct = stats.sent > 0 ? Math.round(stats.ok / Math.max(stats.sent, 1) * 100) : 0;
  const barWidth = Math.min(100, stats.sent / 50 * 100);
  const successLabel = key === 'voice' ? '응답률' : '성공률';
  const sentLabel = key === 'voice' ? '발신' : '발송';
  const deliveredLabel = key === 'voice' ? '응답' : (key === 'kakao' ? '읽음' : '도달');
  return `
    <div class="channel-block">
      <div class="ch-head">
        <div class="ch-name">
          <div class="ch-icon ${key}">${{ kakao: 'K', sms: 'S', voice: 'V' }[key]}</div>
          <div><div>${label}</div><div class="ch-num">${num}</div></div>
        </div>
        <span class="ch-meta">${successLabel} ${pct}%</span>
      </div>
      <div class="ch-progress"><div class="ch-progress-bar ${key}" style="width: ${barWidth}%"></div></div>
      <div class="ch-stats">
        <span>${sentLabel} <strong>${stats.sent}</strong></span>
        <span>${deliveredLabel} <strong>${stats.ok}</strong></span>
        <span>실패 <strong>${stats.failed}</strong></span>
      </div>
    </div>`;
}

function renderBarsChart(data) {
  const chartLeft = 40, chartRight = 800, chartTop = 20, chartBottom = 190;
  const bw = (chartRight - chartLeft) / data.length - 8;
  let bars = '';
  let xLabels = '';
  let trend = [];
  data.forEach((d, i) => {
    const x = chartLeft + i * ((chartRight - chartLeft) / data.length) + 4;
    const scale = (chartBottom - chartTop) / 100;
    const takenH = d.t * scale;
    const partialH = d.p * scale;
    const missedH = d.m * scale;
    const takenY = chartBottom - takenH;
    const partialY = takenY - partialH;
    const missedY = partialY - missedH;
    bars += `<rect x="${x}" y="${takenY}" width="${bw}" height="${takenH}" fill="#00d2b4" rx="1"/>`;
    bars += `<rect x="${x}" y="${partialY}" width="${bw}" height="${partialH}" fill="#d4a524" rx="1"/>`;
    bars += `<rect x="${x}" y="${missedY}" width="${bw}" height="${missedH}" fill="#c55a34" rx="1"/>`;
    xLabels += `<text x="${x + bw/2}" y="210" text-anchor="middle">${d.date}</text>`;
    trend.push(`${x + bw/2},${chartBottom - d.t * scale}`);
  });
  return `<svg class="chart-svg" viewBox="0 0 800 220" preserveAspectRatio="none">
    <g stroke="#ddd4bc" stroke-width="0.5" stroke-dasharray="2,3">
      <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="90" x2="800" y2="90"/>
      <line x1="0" y1="140" x2="800" y2="140"/><line x1="0" y1="190" x2="800" y2="190"/>
    </g>
    <g fill="#706e62" font-family="JetBrains Mono" font-size="9">
      <text x="4" y="38">100%</text><text x="4" y="88">75%</text>
      <text x="4" y="138">50%</text><text x="4" y="188">25%</text>
    </g>
    ${bars}
    <g fill="#706e62" font-family="JetBrains Mono" font-size="9" text-anchor="middle">${xLabels}</g>
    <path d="M${trend.join(' L')}" stroke="#00d2b4" stroke-width="1.5" fill="none" stroke-dasharray="3,3" opacity="0.55"/>
  </svg>`;
}

function renderRxRow(rx) {
  const p = getPatient(rx.patientId);
  const warnings = checkInteractions(rx.drugs);
  const hasHigh = warnings.some(w => w.severity === 'high');
  let statusPill = '';
  if (hasHigh) statusPill = '<span class="pill red"><span class="status-dot"></span>상호작용 경고</span>';
  else if (rx.status === 'pending') statusPill = '<span class="pill yellow"><span class="status-dot"></span>대기</span>';
  else if (rx.status === 'dispensing') statusPill = '<span class="pill blue"><span class="status-dot"></span>조제중</span>';
  else if (rx.status === 'completed') statusPill = '<span class="pill green"><span class="status-dot"></span>완료</span>';
  else statusPill = '<span class="pill gray">' + esc(rx.status) + '</span>';

  const drugSummary = rx.drugs.slice(0, 2).map(d => esc(d.name)).join(' · ') + (rx.drugs.length > 2 ? ` 외 ${rx.drugs.length - 2}건` : '');
  const dosage = rx.drugs[0]?.dosage || '';

  return `<tr onclick="openRxDetail('${rx.id}')">
    <td class="mono">#${rx.id.toUpperCase()}</td>
    <td class="name">${p ? esc(p.name) : '—'}<span class="sub-line">${p ? p.gender + ' · ' + p.age + '세' : ''}</span></td>
    <td>${drugSummary}<span class="sub-line">${esc(dosage)}</span></td>
    <td class="mono">${esc(rx.issuedBy)} / ${esc(rx.doctor)}</td>
    <td>${statusPill}</td>
    <td><button class="row-action" onclick="event.stopPropagation(); openRxDetail('${rx.id}')">보기</button></td>
  </tr>`;
}

/* ---------- Prescriptions View ---------- */
let rxFilter = { status: 'all', q: '' };

function renderPrescriptions() {
  const view = $('#view-prescriptions');
  let list = state.prescriptions.slice().sort((a, b) => b.issuedAt.localeCompare(a.issuedAt));
  if (rxFilter.status !== 'all') {
    list = list.filter(r => {
      if (rxFilter.status === 'warning') return checkInteractions(r.drugs).some(w => w.severity === 'high');
      return r.status === rxFilter.status;
    });
  }
  if (rxFilter.q) {
    const q = rxFilter.q.toLowerCase();
    list = list.filter(r => {
      const p = getPatient(r.patientId);
      return (r.id.includes(q) || (p && p.name.includes(q)) || r.issuedBy.toLowerCase().includes(q) || r.doctor.includes(q) || r.drugs.some(d => d.name.includes(q)));
    });
  }

  view.innerHTML = `
    <div class="page-header">
      <div>
        <div class="subtitle">Operations — 02</div>
        <h1 class="title">처방 <em>큐</em></h1>
      </div>
      <div class="header-actions">
        <button class="btn primary" onclick="openPrescriptionForm()">
          <svg viewBox="0 0 24 24"><path d="M12 5 L12 19 M5 12 L19 12"/></svg> 새 처방
        </button>
      </div>
    </div>

    <div class="filter-bar">
      <div class="filters">
        <div class="tab-group">
          <button class="tab ${rxFilter.status === 'all' ? 'active' : ''}" onclick="setRxFilter('status', 'all')">전체 ${state.prescriptions.length}</button>
          <button class="tab ${rxFilter.status === 'pending' ? 'active' : ''}" onclick="setRxFilter('status', 'pending')">대기 ${state.prescriptions.filter(r => r.status === 'pending').length}</button>
          <button class="tab ${rxFilter.status === 'dispensing' ? 'active' : ''}" onclick="setRxFilter('status', 'dispensing')">조제중 ${state.prescriptions.filter(r => r.status === 'dispensing').length}</button>
          <button class="tab ${rxFilter.status === 'warning' ? 'active' : ''}" onclick="setRxFilter('status', 'warning')">경고 ${state.prescriptions.filter(r => checkInteractions(r.drugs).some(w => w.severity === 'high')).length}</button>
          <button class="tab ${rxFilter.status === 'completed' ? 'active' : ''}" onclick="setRxFilter('status', 'completed')">완료 ${state.prescriptions.filter(r => r.status === 'completed').length}</button>
        </div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16 L21 21"/></svg>
        <input type="text" placeholder="환자명, Rx ID, 약품, 의원 검색" id="rx-search" value="${esc(rxFilter.q)}">
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        ${list.length > 0 ? `<div class="table-wrap"><table>
          <thead><tr><th>Rx · ID</th><th>환자</th><th>처방 약품</th><th>발행처</th><th>상태</th><th>발행일</th><th></th></tr></thead>
          <tbody>${list.map(rx => {
            const p = getPatient(rx.patientId);
            const warnings = checkInteractions(rx.drugs);
            const hasHigh = warnings.some(w => w.severity === 'high');
            let statusPill = hasHigh ? '<span class="pill red"><span class="status-dot"></span>상호작용 경고</span>' :
              rx.status === 'pending' ? '<span class="pill yellow"><span class="status-dot"></span>대기</span>' :
              rx.status === 'dispensing' ? '<span class="pill blue"><span class="status-dot"></span>조제중</span>' :
              rx.status === 'completed' ? '<span class="pill green"><span class="status-dot"></span>완료</span>' :
              '<span class="pill gray">' + esc(rx.status) + '</span>';
            const drugSummary = rx.drugs.slice(0, 2).map(d => esc(d.name)).join(' · ') + (rx.drugs.length > 2 ? ` 외 ${rx.drugs.length - 2}건` : '');
            return `<tr onclick="openRxDetail('${rx.id}')">
              <td class="mono">#${rx.id.toUpperCase()}</td>
              <td class="name">${p ? esc(p.name) : '—'}<span class="sub-line">${p ? p.gender + ' · ' + p.age + '세' : ''}</span></td>
              <td>${drugSummary}<span class="sub-line">${esc(rx.drugs[0]?.dosage || '')}</span></td>
              <td class="mono">${esc(rx.issuedBy)} / ${esc(rx.doctor)}</td>
              <td>${statusPill}</td>
              <td class="mono">${formatDate(rx.issuedAt)}</td>
              <td><button class="row-action" onclick="event.stopPropagation(); openRxDetail('${rx.id}')">보기</button></td>
            </tr>`;
          }).join('')}</tbody></table></div>` : '<div class="empty"><h4>처방이 없습니다</h4><p>새 처방을 등록하거나 필터를 조정하세요.</p><button class="btn primary" onclick="openPrescriptionForm()">+ 새 처방 등록</button></div>'}
      </div>
    </div>
  `;
  $('#rx-search').addEventListener('input', (e) => { rxFilter.q = e.target.value; renderPrescriptions(); });
}

function setRxFilter(k, v) { rxFilter[k] = v; renderPrescriptions(); }

/* ---------- Prescription Form ---------- */
function openPrescriptionForm(rxId = null) {
  const rx = rxId ? getRx(rxId) : null;
  const isEdit = !!rx;
  const formDrugs = rx ? JSON.parse(JSON.stringify(rx.drugs)) : [{ name: '', dosage: '', duration: 30, quantity: 30 }];
  const patientOptions = state.patients.map(p => `<option value="${p.id}" ${rx && rx.patientId === p.id ? 'selected' : ''}>${esc(p.name)} (${p.gender} · ${p.age}세)</option>`).join('');

  openModal(`
    <div class="modal-header">
      <div>
        <h3>${isEdit ? '처방 수정' : '새 처방 등록'}</h3>
        <div class="subtitle">${isEdit ? '#' + rx.id.toUpperCase() : 'NEW PRESCRIPTION'}</div>
      </div>
      <button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M6 18 L18 6"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>환자<span class="req">*</span></label>
        <select id="rx-patient"><option value="">— 선택 —</option>${patientOptions}</select>
      </div>
      <div class="field-row">
        <div class="field"><label>발행 의원<span class="req">*</span></label><input type="text" id="rx-issuedBy" value="${esc(rx?.issuedBy || '')}" placeholder="예: 서울내과"></div>
        <div class="field"><label>처방 의사<span class="req">*</span></label><input type="text" id="rx-doctor" value="${esc(rx?.doctor || '')}" placeholder="예: 박정훈"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>발행일</label><input type="date" id="rx-issuedAt" value="${rx?.issuedAt || today()}"></div>
        <div class="field"><label>상태</label><select id="rx-status">
          <option value="pending" ${(!rx || rx.status === 'pending') ? 'selected' : ''}>대기</option>
          <option value="dispensing" ${rx?.status === 'dispensing' ? 'selected' : ''}>조제중</option>
          <option value="completed" ${rx?.status === 'completed' ? 'selected' : ''}>완료</option>
        </select></div>
      </div>

      <div class="field">
        <label>처방 약품<span class="req">*</span></label>
        <div class="drug-list" id="drug-list">
          ${formDrugs.map((d, i) => drugItemHtml(d, i)).join('')}
        </div>
        <button type="button" class="add-drug-btn" onclick="addDrugItem()">+ 약품 추가</button>
        <div id="interaction-warnings"></div>
      </div>

      <div class="field"><label>메모</label><textarea id="rx-notes" placeholder="특이사항">${esc(rx?.notes || '')}</textarea></div>
    </div>
    <div class="modal-footer">
      ${isEdit ? `<button class="btn danger" id="rx-delete" style="margin-right: auto;">삭제</button>` : ''}
      <button class="btn" data-close>취소</button>
      <button class="btn primary" id="rx-save">${isEdit ? '수정 저장' : '처방 등록'}</button>
    </div>
  `, true);

  const updateWarnings = () => {
    const items = $$('#drug-list .drug-item');
    const drugs = items.map(it => ({ name: $('[data-k="name"]', it).value, dosage: $('[data-k="dosage"]', it).value, duration: +$('[data-k="duration"]', it).value || 0, quantity: +$('[data-k="quantity"]', it).value || 0 }));
    const warnings = checkInteractions(drugs);
    const box = $('#interaction-warnings');
    if (warnings.length > 0) {
      box.innerHTML = warnings.map(w => `<div class="warning-box ${w.severity === 'high' ? 'red' : 'yellow'}">
        <svg viewBox="0 0 24 24"><path d="M12 3 L22 20 L2 20 Z M12 10 L12 15 M12 17 L12 18"/></svg>
        <div><strong>${w.severity === 'high' ? '상호작용 경고' : '주의'}</strong> — ${esc(w.drugs.join(' + '))} · ${esc(w.msg)}</div>
      </div>`).join('');
    } else {
      box.innerHTML = '';
    }
  };
  $('#drug-list').addEventListener('input', updateWarnings);
  updateWarnings();

  $('#rx-save').addEventListener('click', () => {
    const patientId = $('#rx-patient').value;
    const issuedBy = $('#rx-issuedBy').value.trim();
    const doctor = $('#rx-doctor').value.trim();
    const issuedAt = $('#rx-issuedAt').value;
    const status = $('#rx-status').value;
    const notes = $('#rx-notes').value.trim();
    const drugs = $$('#drug-list .drug-item').map(it => ({
      name: $('[data-k="name"]', it).value.trim(),
      dosage: $('[data-k="dosage"]', it).value.trim(),
      duration: +$('[data-k="duration"]', it).value || 0,
      quantity: +$('[data-k="quantity"]', it).value || 0,
    })).filter(d => d.name);

    if (!patientId) return toast('환자를 선택하세요', 'error');
    if (!issuedBy || !doctor) return toast('발행 의원·의사를 입력하세요', 'error');
    if (drugs.length === 0) return toast('최소 한 개의 약품을 입력하세요', 'error');

    if (isEdit) {
      Object.assign(rx, { patientId, issuedBy, doctor, issuedAt, status, notes, drugs });
      logAudit('update', 'prescription', rx.id, `처방 #${rx.id.toUpperCase()} 수정 · ${drugs.length}개 약품`);
      toast('처방이 수정되었습니다', 'success');
    } else {
      const newRx = {
        id: 'rx' + (state.prescriptions.length + 1) + '_' + uid().slice(0, 4),
        patientId, drugs, issuedBy, doctor, issuedAt, status, notes,
      };
      state.prescriptions.push(newRx);
      logAudit('create', 'prescription', newRx.id, `새 처방 등록 · ${drugs.length}개 약품 · ${issuedBy}`);
      toast('새 처방이 등록되었습니다', 'success');
    }
    saveState();
    closeModal();
    render();
  });

  if (isEdit) {
    $('#rx-delete').addEventListener('click', () => {
      closeModal();
      confirmDialog('처방을 삭제할까요?', `#${rx.id.toUpperCase()}을 영구 삭제합니다. 복구할 수 없습니다.`, () => {
        logAudit('delete', 'prescription', rx.id, `처방 #${rx.id.toUpperCase()} 삭제`);
        state.prescriptions = state.prescriptions.filter(r => r.id !== rx.id);
        saveState();
        render();
        toast('처방이 삭제되었습니다', 'success');
      });
    });
  }
}

function drugItemHtml(d, i) {
  return `<div class="drug-item">
    <input type="text" data-k="name" placeholder="약품명 (예: 암로디핀 5mg)" value="${esc(d.name || '')}">
    <input type="text" data-k="dosage" placeholder="용법 (예: 1일 1회, 아침 식후)" value="${esc(d.dosage || '')}">
    <input type="number" data-k="duration" placeholder="일수" value="${d.duration || ''}" min="1">
    <button type="button" class="remove-drug" onclick="this.parentElement.remove(); document.getElementById('drug-list').dispatchEvent(new Event('input', {bubbles:true}));" title="삭제">
      <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M6 6 L18 18 M6 18 L18 6"/></svg>
    </button>
    <input type="hidden" data-k="quantity" value="${d.quantity || 0}">
  </div>`;
}
function addDrugItem() {
  $('#drug-list').insertAdjacentHTML('beforeend', drugItemHtml({ duration: 30 }, 0));
  $('#drug-list').dispatchEvent(new Event('input', { bubbles: true }));
}

/* ---------- Rx Detail ---------- */
function openRxDetail(id) {
  const rx = getRx(id);
  if (!rx) return;
  const p = getPatient(rx.patientId);
  const warnings = checkInteractions(rx.drugs);

  let statusPill = '';
  const hasHigh = warnings.some(w => w.severity === 'high');
  if (hasHigh) statusPill = '<span class="pill red"><span class="status-dot"></span>상호작용 경고</span>';
  else if (rx.status === 'pending') statusPill = '<span class="pill yellow"><span class="status-dot"></span>대기</span>';
  else if (rx.status === 'dispensing') statusPill = '<span class="pill blue"><span class="status-dot"></span>조제중</span>';
  else if (rx.status === 'completed') statusPill = '<span class="pill green"><span class="status-dot"></span>완료</span>';

  openModal(`
    <div class="modal-header">
      <div>
        <h3>처방 #${rx.id.toUpperCase()}</h3>
        <div class="subtitle">PRESCRIPTION DETAIL · ${formatDate(rx.issuedAt)}</div>
      </div>
      <button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M6 18 L18 6"/></svg></button>
    </div>
    <div class="modal-body" style="padding: 0;">
      <div class="detail-section">
        <div class="detail-row"><div class="key">환자</div><div class="val"><strong>${p ? esc(p.name) : '—'}</strong> · ${p ? p.gender + ' · ' + p.age + '세' : ''}<br><span style="color: var(--ink-muted); font-size: 12px;">${p ? esc(p.phone) : ''}</span></div></div>
        <div class="detail-row"><div class="key">발행처</div><div class="val"><strong>${esc(rx.issuedBy)}</strong> / ${esc(rx.doctor)}</div></div>
        <div class="detail-row"><div class="key">발행일</div><div class="val">${formatDate(rx.issuedAt)}</div></div>
        <div class="detail-row"><div class="key">상태</div><div class="val">${statusPill}</div></div>
        ${rx.notes ? `<div class="detail-row"><div class="key">메모</div><div class="val">${esc(rx.notes)}</div></div>` : ''}
      </div>

      <div class="detail-section">
        <div class="detail-row" style="grid-template-columns: 1fr;">
          <div class="key" style="margin-bottom: 10px;">처방 약품 (${rx.drugs.length}건)</div>
        </div>
        <table style="font-size: 13px;">
          <thead><tr><th>약품</th><th>용법</th><th>일수</th></tr></thead>
          <tbody>${rx.drugs.map(d => `<tr style="cursor: default;"><td class="name">${esc(d.name)}</td><td>${esc(d.dosage)}</td><td class="mono">${d.duration}일</td></tr>`).join('')}</tbody>
        </table>
        ${warnings.length > 0 ? warnings.map(w => `<div class="warning-box ${w.severity === 'high' ? 'red' : 'yellow'}" style="margin-top: 12px; margin-left: 24px; margin-right: 24px; margin-bottom: 12px;">
          <svg viewBox="0 0 24 24"><path d="M12 3 L22 20 L2 20 Z M12 10 L12 15 M12 17 L12 18"/></svg>
          <div><strong>${w.severity === 'high' ? '상호작용 경고' : '주의'}</strong> — ${esc(w.drugs.join(' + '))} · ${esc(w.msg)}</div>
        </div>`).join('') : ''}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="rx-del">삭제</button>
      <div style="flex-grow: 1;"></div>
      <button class="btn" id="rx-print-label">
        <svg viewBox="0 0 24 24"><path d="M6 9 L6 3 L18 3 L18 9 M6 18 L4 18 L4 10 L20 10 L20 18 L18 18 M8 14 L16 14 L16 22 L8 22 Z"/></svg>
        라벨 인쇄
      </button>
      ${rx.status !== 'completed' ? `<button class="btn" id="rx-complete">조제 완료 처리</button>` : ''}
      <button class="btn" data-close>닫기</button>
      <button class="btn primary" id="rx-edit">수정</button>
    </div>
  `, true);

  $('#rx-edit').addEventListener('click', () => { closeModal(); openPrescriptionForm(rx.id); });
  $('#rx-print-label').addEventListener('click', () => { closeModal(); setTimeout(() => printPrescriptionLabel(rx.id), 100); });
  if ($('#rx-complete')) $('#rx-complete').addEventListener('click', () => {
    rx.status = 'completed';
    logAudit('complete', 'prescription', rx.id, `조제 완료 처리`);
    saveState();
    render();
    closeModal();
    toast('조제 완료 처리되었습니다', 'success');
  });
  $('#rx-del').addEventListener('click', () => {
    confirmDialog('처방을 삭제할까요?', `#${rx.id.toUpperCase()}을 영구 삭제합니다.`, () => {
      logAudit('delete', 'prescription', rx.id, `처방 #${rx.id.toUpperCase()} 삭제`);
      state.prescriptions = state.prescriptions.filter(r => r.id !== rx.id);
      saveState();
      closeModal();
      render();
      toast('처방이 삭제되었습니다', 'success');
    });
  });
}

/* ---------- Patients View ---------- */

      <div>
        <div class="subtitle">Operations — 03</div>
        <h1 class="title">환자 <em>관리</em></h1>
      </div>
      <div class="header-actions">
        <button class="btn primary" onclick="openPatientForm()">
          <svg viewBox="0 0 24 24"><path d="M12 5 L12 19 M5 12 L19 12"/></svg> 환자 등록

      <div class="filters">

      </div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16 L21 21"/></svg>

    <div class="card">

          <tbody>${list.map(p => {
            const logs = state.adherenceLog.filter(a => a.patientId === p.id && (Date.now() - new Date(a.scheduledAt).getTime()) < 7 * 86400000);
            const t = logs.filter(a => a.status === 'taken').length;
            const rate = logs.length > 0 ? Math.round(t / logs.length * 100) : null;
            const chLabel = { kakao: '카카오톡', sms: 'SMS', voice: 'AI 음성' }[p.primaryChannel];
            const rateColor = rate === null ? 'var(--ink-muted)' : rate >= 80 ? 'var(--green)' : rate >= 60 ? '#8a6a14' : 'var(--red)';
            return `<tr onclick="openPatientDetail('${p.id}')">
              <td class="name">${esc(p.name)}<span class="sub-line">${p.gender} · ${p.age}세</span></td>
              <td class="mono">${esc(p.phone)}</td>
              <td>${esc(p.address || '—')}</td>
              <td><span class="pill gray">${chLabel}</span></td>
              <td class="mono">${p.caregivers.length}명</td>
              <td class="mono">${formatDate(p.registeredAt)}</td>
              <td style="font-family: 'IBM Plex Mono', 'HCR Dotum', 'Noto Sans KR', monospace; color: ${rateColor};">${rate !== null ? rate + '%' : '—'}</td>
              <td><button class="row-action" onclick="event.stopPropagation(); openPatientDetail('${p.id}')">상세</button></td>
            </tr>`;
          }).join('')}</tbody></table></div>` : '<div class="empty"><h4>환자가 없습니다</h4><p>검색 조건을 조정하거나 새 환자를 등록하세요.</p><button class="btn primary" onclick="openPatientForm()">+ 환자 등록</button></div>'}
      </div>
    </div>
  `;
  $('#pt-search').addEventListener('input', (e) => { ptFilter.q = e.target.value; renderPatients(); });
}

  openModal(`
    <div class="modal-header">
      <div>
        <h3>${isEdit ? '환자 수정' : '새 환자 등록'}</h3>
        <div class="subtitle">${isEdit ? 'EDIT PATIENT' : 'NEW PATIENT'}</div>
      </div>
      <button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M6 18 L18 6"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>성명<span class="req">*</span></label><input type="text" id="pt-name" value="${esc(p?.name || '')}" placeholder="홍길동"></div>
        <div class="field-row" style="grid-column: 2;">
          <div class="field"><label>성별</label><select id="pt-gender"><option value="M" ${p?.gender === 'M' ? 'selected' : ''}>남</option><option value="F" ${p?.gender === 'F' ? 'selected' : ''}>여</option></select></div>
          <div class="field"><label>나이</label><input type="number" id="pt-age" value="${p?.age || ''}" min="0" max="120"></div>
        </div>

      <button class="btn primary" id="pt-save">${isEdit ? '수정 저장' : '등록'}</button>

  `, false);

  $('#pt-save').addEventListener('click', () => {
    const name = $('#pt-name').value.trim();
    const age = +$('#pt-age').value || 0;
    const gender = $('#pt-gender').value;
    const phone = $('#pt-phone').value.trim();
    const address = $('#pt-address').value.trim();
    const primaryChannel = $('#pt-channel').value;
    const notes = $('#pt-notes').value.trim();
    const caregiversList = $$('#cg-list .drug-item').map(it => ({
      name: $('[data-k="cg-name"]', it).value.trim(),
      phone: $('[data-k="cg-phone"]', it).value.trim(),
      channel: $('[data-k="cg-channel"]', it).value,
    })).filter(c => c.name);

    if (!name) return toast('성명을 입력하세요', 'error');
    if (!phone) return toast('연락처를 입력하세요', 'error');

    if (isEdit) {
      Object.assign(p, { name, age, gender, phone, address, primaryChannel, notes, caregivers: caregiversList });
      logAudit('update', 'patient', p.id, `환자 ${name} 정보 수정`);
      toast('환자 정보가 수정되었습니다', 'success');
    } else {
      const newP = {
        id: 'p' + (state.patients.length + 1) + '_' + uid().slice(0, 4),
        name, age, gender, phone, address, primaryChannel, notes,
        caregivers: caregiversList,
        registeredAt: today(),
      };
      state.patients.push(newP);
      logAudit('create', 'patient', newP.id, `환자 등록 · ${name} (${gender}/${age}세)`);
      toast('새 환자가 등록되었습니다', 'success');
    }
    saveState();
    closeModal();
    render();
  });

  if (isEdit) {
    $('#pt-delete').addEventListener('click', () => {
      const rxCount = state.prescriptions.filter(r => r.patientId === p.id).length;
      const msg = rxCount > 0 ? `${p.name}님의 처방 ${rxCount}건도 함께 삭제됩니다.` : '이 환자의 모든 기록이 영구 삭제됩니다.';
      closeModal();
      confirmDialog('환자를 삭제할까요?', msg, () => {
        logAudit('delete', 'patient', p.id, `환자 ${p.name} 삭제 · 처방 ${rxCount}건 포함`);
        state.patients = state.patients.filter(x => x.id !== p.id);
        state.prescriptions = state.prescriptions.filter(r => r.patientId !== p.id);
        state.adherenceLog = state.adherenceLog.filter(a => a.patientId !== p.id);
        saveState();
        render();
        toast('환자가 삭제되었습니다', 'success');
      });
    });
  }
}

/* ---------- Monitoring View ---------- */
function renderMonitoring() {
  const view = $('#view-monitoring');
  // Build today's schedule based on active prescriptions
  const todayStr = today();
  const schedule = [];
  state.prescriptions.filter(r => r.status !== 'completed' || (Date.now() - new Date(r.issuedAt).getTime()) < 5 * 86400000).forEach(rx => {
    rx.drugs.forEach(drug => {
      // Heuristic: parse dosage for times
      const times = [];
      if (/아침|공복/.test(drug.dosage)) times.push('08:00');
      if (/점심/.test(drug.dosage)) times.push('12:30');
      if (/저녁|취침/.test(drug.dosage)) times.push(/취침/.test(drug.dosage) ? '22:00' : '19:00');
      if (/1일 2회/.test(drug.dosage) && times.length < 2) { times.length = 0; times.push('08:00', '19:00'); }
      if (/1일 3회/.test(drug.dosage) && times.length < 3) { times.length = 0; times.push('08:00', '12:30', '19:00'); }
      if (times.length === 0) times.push('09:00');

      times.forEach(t => {
        // Check if already logged today
        const log = state.adherenceLog.find(a => a.patientId === rx.patientId && a.prescriptionId === rx.id && a.drugName === drug.name && a.scheduledAt === todayStr + 'T' + t);
        const status = log ? log.status : 'pending';
        schedule.push({ patientId: rx.patientId, prescriptionId: rx.id, drugName: drug.name, dosage: drug.dosage, time: t, status, logId: log?.id });
      });
    });
  });
  schedule.sort((a, b) => a.time.localeCompare(b.time));

  const pending = schedule.filter(s => s.status === 'pending').length;
  const taken = schedule.filter(s => s.status === 'taken').length;
  const missed = schedule.filter(s => s.status === 'missed').length;

  view.innerHTML = `
    <div class="page-header">
      <div>
        <div class="subtitle">Operations — 04 · ${new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' })}</div>
        <h1 class="title">오늘의 <em>복약 스케줄</em></h1>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-head"><span class="kpi-label">예정</span><span class="kpi-delta neutral">Pending</span></div>
        <div class="kpi-value">${pending}<span class="unit">건</span></div>
        <div class="kpi-sub">아직 복용 전</div>
      </div>
      <div class="kpi">
        <div class="kpi-head"><span class="kpi-label">복용 완료</span><span class="kpi-delta up">Taken</span></div>
        <div class="kpi-value">${taken}<span class="unit">건</span></div>
        <div class="kpi-sub">정상 복용 확인</div>
      </div>
      <div class="kpi">
        <div class="kpi-head"><span class="kpi-label">누락</span><span class="kpi-delta ${missed > 0 ? 'down' : 'neutral'}">Missed</span></div>
        <div class="kpi-value">${missed}<span class="unit">건</span></div>
        <div class="kpi-sub">알림 재발송 필요</div>
      </div>
      <div class="kpi">
        <div class="kpi-head"><span class="kpi-label">총 스케줄</span><span class="kpi-delta neutral">Total</span></div>
        <div class="kpi-value">${schedule.length}<span class="unit">건</span></div>
        <div class="kpi-sub">오늘 복약 건수</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title"><span class="code">S</span>시간대별 복약 스케줄 <span class="count">${schedule.length}건</span></div></div>
      <div class="card-body">
        ${schedule.length > 0 ? schedule.map(s => {
          const p = getPatient(s.patientId);
          const pill = s.status === 'taken' ? '<span class="pill green"><span class="status-dot"></span>복용 완료</span>' :
            s.status === 'missed' ? '<span class="pill red"><span class="status-dot"></span>누락</span>' :
            s.status === 'partial' ? '<span class="pill yellow"><span class="status-dot"></span>일부 복용</span>' :
            '<span class="pill gray"><span class="status-dot"></span>대기</span>';
          return `<div class="schedule-row">
            <div class="schedule-time">${s.time}<span class="date">${todayStr.slice(5).replace('-', '.')}</span></div>
            <div class="schedule-info">
              <div class="name">${p ? esc(p.name) : '—'} · ${esc(s.drugName)}</div>
              <div class="drug">${esc(s.dosage)}</div>
              <div style="margin-top: 6px;">${pill}</div>
            </div>
            <div class="schedule-actions">
              ${s.status === 'pending' ? `
                <button class="row-action" onclick="markTaken('${s.patientId}', '${s.prescriptionId}', '${esc(s.drugName)}', '${s.time}', 'taken')">✓ 완료</button>
                <button class="row-action danger" onclick="markTaken('${s.patientId}', '${s.prescriptionId}', '${esc(s.drugName)}', '${s.time}', 'missed')">✗ 누락</button>
              ` : `<button class="row-action" onclick="markTaken('${s.patientId}', '${s.prescriptionId}', '${esc(s.drugName)}', '${s.time}', 'pending', '${s.logId || ''}')">되돌리기</button>`}
              <button class="row-action" onclick="sendReminder('${s.patientId}', '${esc(s.drugName)}', '${s.time}')">알림 재발송</button>
            </div>
          </div>`;
        }).join('') : '<div class="empty"><h4>오늘 복약 스케줄이 없습니다</h4><p>활성 처방을 등록하면 스케줄이 자동 생성됩니다.</p></div>'}
      </div>
    </div>
  `;
}

function markTaken(patientId, rxId, drugName, time, status, logId) {
  const todayStr = today();
  const scheduledAt = todayStr + 'T' + time;
  const p = getPatient(patientId);
  if (status === 'pending' && logId) {
    state.adherenceLog = state.adherenceLog.filter(a => a.id !== logId);
    logAudit('update', 'adherence', logId, `${p?.name || ''} ${drugName} ${time} 기록 취소`);
    toast('복약 기록이 취소되었습니다', 'default');
  } else {
    state.adherenceLog = state.adherenceLog.filter(a => !(a.patientId === patientId && a.prescriptionId === rxId && a.drugName === drugName && a.scheduledAt === scheduledAt));
    state.adherenceLog.push({ id: uid(), patientId, prescriptionId: rxId, drugName, scheduledAt, status, recordedAt: new Date().toISOString() });
    logAudit('record', 'adherence', patientId, `${p?.name || ''} ${drugName} ${time} · ${status === 'taken' ? '복용 완료' : '누락'}`);
    toast(status === 'taken' ? '복용 완료로 기록되었습니다' : '누락으로 기록되었습니다', status === 'taken' ? 'success' : 'warning');
  }
  saveState();
  render();
}

function sendReminder(patientId, drugName, time) {
  const p = getPatient(patientId);
  if (!p) return;
  const ch = p.primaryChannel;
  const chLabel = { kakao: '카카오톡', sms: 'SMS', voice: 'AI 음성' }[ch];
  const msg = `${time.split(':')[0] < '12' ? '아침' : (time.split(':')[0] < '18' ? '점심' : '저녁')} 복약 안내: ${drugName}`;
  state.notificationLog.push({
    id: uid(), patientId, channel: ch, type: 'reminder-resend',
    scheduledAt: new Date().toISOString(), sentAt: new Date().toISOString(),
    status: Math.random() > 0.05 ? 'sent' : 'failed', message: msg,
  });
  logAudit('send', 'notification', patientId, `${p.name} · ${chLabel} 알림 재발송`);
  saveState();
  render();
  toast(`${p.name}님에게 ${chLabel}로 알림 재발송되었습니다`, 'success');
}

const URGENCY_KEYWORDS = {
  urgent: ['호흡곤란','의식','실신','대량출혈','아나필락시스','흉통','마비','경련','혈뇨','검은 변','갈색 소변'],

  mild: ['속쓰림','졸림','두통','어지럼증','구역질','설사','변비','피로','식욕감소','코막힘','구갈','복통','근육통','관절통','소화불량','멍']
};

function matchSideEffect(symptom, patientDrugs) {
  const results = [];
  const sym = symptom.toLowerCase().replace(/\s/g, '');
  for (const drug of patientDrugs) {
    const info = DRUG_SIDE_EFFECTS[drug];
    if (!info) continue;
    const allEffects = [...info.common, ...info.serious];
    for (const effect of allEffects) {
      if (sym.includes(effect.replace(/\s/g, '').toLowerCase()) || effect.replace(/\s/g, '').toLowerCase().includes(sym)) {
        const isSeri = info.serious.some(s => s.replace(/\s/g,'').toLowerCase().includes(sym) || sym.includes(s.replace(/\s/g,'').toLowerCase()));
        results.push({ drug, effect, severity: isSeri ? 'serious' : 'common', freq: info.freq });
      }
    }
  }
  return results;
}

function classifyUrgency(symptom) {
  const sym = symptom.replace(/\s/g, '').toLowerCase();
  for (const kw of URGENCY_KEYWORDS.urgent) {
    if (sym.includes(kw.replace(/\s/g,'').toLowerCase())) return 'urgent';
  }
  for (const kw of URGENCY_KEYWORDS.warning) {
    if (sym.includes(kw.replace(/\s/g,'').toLowerCase())) return 'warning';
  }
  return 'mild';
}

window.submitSideEffect = function() {
  const patientId = $('#se-patient')?.value;
  const symptom = $('#se-symptom')?.value?.trim();
  if (!patientId || !symptom) return alert('환자와 증상을 입력하세요.');

  const patient = state.patients.find(p => p.id === patientId);
  if (!patient) return;

  const patientDrugs = [];
  state.prescriptions.filter(rx => rx.patientId === patientId && rx.status !== 'cancelled').forEach(rx => {
    (rx.drugs || []).forEach(d => {
      const name = d.name.replace(/\s*\d+\s*(mg|mcg|ml|정|캡슐|포).*/i, '').trim();
      if (!patientDrugs.includes(name)) patientDrugs.push(name);
    });
  });

  const matches = matchSideEffect(symptom, patientDrugs);
  const urgency = classifyUrgency(symptom);

  if (!state.sideEffectReports) state.sideEffectReports = [];
  const report = {
    patientId, patientName: patient.name, symptom, timestamp: new Date().toISOString(),
    urgency, matches, drugs: patientDrugs,
    pharmacyNotified: true,
    hospitalReported: false,
    pharmacyNotifiedAt: new Date().toISOString(),
  };
  state.sideEffectReports.unshift(report);
  saveState();
  logAudit('create', 'side-effect', patient.name, '증상: ' + symptom + ' / 긴급도: ' + urgency);
  logAudit('notify', 'pharmacy', patient.name, '부작용 신고 약국 자동 전송: ' + symptom);

  if (urgency === 'urgent') {
    alert('⚠ 긴급 증상입니다!\n즉시 119 또는 응급실 방문을 안내하세요.\n보호자에게 자동 알림이 발송됩니다.');
  }

  // Update chat display
  const chat = document.getElementById('se-chat');
  if (chat) {
    const matchHtml = matches.length > 0
      ? '<div style="background:rgba(0,210,180,0.08);border:1px solid rgba(0,210,180,0.15);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px;color:var(--accent);line-height:1.5;">'
        + '<strong>매칭 결과:</strong><br>'
        + matches.map(m => m.drug + ' → ' + m.effect + ' (' + m.freq + ')').join('<br>')
        + '</div>'
      : '';
    chat.innerHTML =
      '<div style="margin-bottom:8px;"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="font-size:13px;font-weight:500;color:var(--accent);">' + esc(patient.name) + '</span><span style="font-size:12px;color:var(--ink-muted);">방금</span></div>'
      + '<div style="background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:13px;display:inline-block;">' + esc(symptom) + '</div></div>'
      + '<div style="margin-bottom:8px;"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="font-size:13px;font-weight:500;color:var(--accent);">MedIT</span><span style="font-size:12px;color:var(--ink-muted);">자동 분석</span></div>'
      + '<div style="background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;display:inline-block;line-height:1.6;">'
      + '긴급도: <strong style="color:' + (urgency === 'urgent' ? 'var(--red)' : urgency === 'warning' ? 'var(--yellow)' : 'var(--accent)') + ';">' + (urgency === 'urgent' ? '긴급' : urgency === 'warning' ? '주의' : '경미') + '</strong><br>'
      + '약국 알림: <strong style="color:var(--accent);">전송 완료</strong>'
      + matchHtml
      + '</div></div>';
  }
};

window.notifyPharmacy = function(idx) {
  const r = state.sideEffectReports[idx];
  if (!r || r.pharmacyNotified) return;
  r.pharmacyNotified = true;
  r.pharmacyNotifiedAt = new Date().toISOString();
  saveState();
  logAudit('notify', 'pharmacy', r.patientName, '부작용 약국 수동 전송: ' + r.symptom);
  render();
};

window.sendToHospital = function(idx) {
  const r = state.sideEffectReports[idx];
  if (!r) return;
  r.hospitalReported = true;
  r.hospitalReportedAt = new Date().toISOString();
  saveState();
  logAudit('create', 'hospital-report', r.patientName, '병원 제출용 리포트 생성: ' + r.symptom);
  generateSingleReport(r);
};

window.connectPOS = function(posId) {
  if (!state.posConfig) state.posConfig = {};
  state.posConfig.activeAdapter = posId;
  state.posConfig.lastSync = new Date().toISOString();
  state.posConfig.syncCount = 0;
  state.posConfig.autoSync = false;
  saveState();
  const pos = POS_SYSTEMS.find(p => p.id === posId);
  logAudit('create', 'pos-bridge', pos?.name || posId, 'POS 어댑터 연결');
  render();
};

window.disconnectPOS = function() {
  const name = POS_SYSTEMS.find(p => p.id === state.posConfig?.activeAdapter)?.name || '';
  state.posConfig.activeAdapter = null;
  state.posConfig.autoSync = false;
  saveState();
  logAudit('delete', 'pos-bridge', name, 'POS 어댑터 해제');
  render();
};

window.syncPOS = function() {
  if (!state.posConfig?.activeAdapter) return;
  state.posConfig.lastSync = new Date().toISOString();
  state.posConfig.syncCount = (state.posConfig.syncCount || 0) + Math.floor(Math.random() * 5) + 1;
  saveState();
  logAudit('update', 'pos-bridge', 'sync', '수동 동기화 실행');
  render();
};

window.toggleAutoSync = function() {
  if (!state.posConfig) return;
  state.posConfig.autoSync = !state.posConfig.autoSync;
  saveState();
  render();
};

window.copyCardText = function() {
  const scroll = document.getElementById('med-cards');
  if (!scroll) return;
  // Find which card is most visible
  const cards = scroll.querySelectorAll('.med-card');
  const scrollLeft = scroll.scrollLeft;
  const cardWidth = 316; // 300 + 16 gap
  const idx = Math.round(scrollLeft / cardWidth);
  const card = cards[idx] || cards[0];
  if (!card) return;
  const text = card.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = '✓ 복사됨';
    setTimeout(() => btn.textContent = '텍스트 복사', 1500);
  }).catch(() => {
    // Fallback: select text
    const range = document.createRange();
    range.selectNodeContents(card);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });
};

window.copyAllCards = function() {
  const cards = document.querySelectorAll('.med-card');
  let text = '📋 복약지도\n━━━━━━━━━━━━━━━\n\n';
  cards.forEach((card, i) => {
    const lines = card.innerText.split('\n').filter(l => l.trim());
    text += lines.join('\n') + '\n\n';
    if (i < cards.length - 1) text += '───────────────\n\n';
  });
  text += '━━━━━━━━━━━━━━━\nMedIT 복약관리시스템';
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    btn.textContent = '✓ 전체 복사됨';
    setTimeout(() => btn.textContent = '전체 복사', 1500);
  });
};

window.shareCards = function() {
  const cards = document.querySelectorAll('.med-card');
  let text = '📋 복약지도\n\n';
  cards.forEach(card => {
    const lines = card.innerText.split('\n').filter(l => l.trim());
    text += lines.join('\n') + '\n\n';
  });
  text += 'MedIT 복약관리시스템';

  if (navigator.share) {
    navigator.share({ title: '복약지도', text }).catch(() => {});
  } else {
    navigator.clipboard.writeText(text).then(() => alert('클립보드에 복사되었습니다.\n카카오톡이나 문자에 붙여넣기 하세요.'));
  }
};

    a.href = url;
    a.download = `medit-backup-${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('백업 파일이 다운로드되었습니다', 'success');
  });

  $('#btn-import').addEventListener('click', () => $('#import-file').click());
  $('#import-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!imported.version || !imported.patients || !imported.prescriptions) throw new Error('잘못된 형식');

          saveState();
          render();
          toast('데이터가 복원되었습니다', 'success');
        }, '복원', false);
      } catch (err) {
        toast('파일 읽기 실패: ' + err.message, 'error');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  $('#btn-reset').addEventListener('click', () => {
    confirmDialog('데모 데이터로 초기화할까요?', '현재 모든 기록이 삭제되고 데모 데이터로 재설정됩니다.', resetState, '초기화');
  });
}

        <div class="field"><label>면허번호</label><input type="text" id="ph-license" value="${esc(ph?.license || '')}" placeholder="약사면허 제00000호"></div>

      ${isSelf ? '<div class="warning-box yellow"><svg viewBox="0 0 24 24"><path d="M12 3 L22 20 L2 20 Z M12 10 L12 15 M12 17 L12 18"/></svg><div>본인 계정의 권한은 변경할 수 없습니다.</div></div>' : ''}

      <button class="btn primary" id="ph-save">${isEdit ? '저장' : '추가'}</button>

  $('#ph-save').addEventListener('click', () => {
    const name = $('#ph-name').value.trim();
    const license = $('#ph-license').value.trim();
    const username = $('#ph-username').value.trim();
    const role = $('#ph-role').value;
    const pass = $('#ph-pass').value;

    if (!name) return toast('이름을 입력하세요', 'error');
    if (!username) return toast('아이디를 입력하세요', 'error');
    if (!isEdit && !pass) return toast('비밀번호를 입력하세요', 'error');
    if (pass && pass.length < 4) return toast('비밀번호는 최소 4자', 'error');

    if (!isEdit) {
      if (state.pharmacists.some(p => p.username === username)) return toast('이미 사용 중인 아이디입니다', 'error');
      const newPh = { id: 'ph' + (state.pharmacists.length + 1) + '_' + uid().slice(0, 4), username, passHash: hashPass(pass), name, license, role, createdAt: today() };
      state.pharmacists.push(newPh);
      logAudit('create', 'pharmacist', newPh.id, `약사 ${name} 추가 · 권한 ${role}`);
      toast('약사가 추가되었습니다', 'success');
    } else {
      ph.name = name;
      ph.license = license;
      if (!isSelf) ph.role = role;
      if (pass) ph.passHash = hashPass(pass);
      logAudit('update', 'pharmacist', ph.id, `약사 ${name} 정보 수정`);
      toast('저장되었습니다', 'success');
    }
    saveState();
    closeModal();
    render();
  });

  if (isEdit && !isSelf) {
    $('#ph-delete').addEventListener('click', () => {
      closeModal();
      confirmDialog('약사 계정을 삭제할까요?', `${ph.name} (${ph.username}) 계정이 영구 삭제됩니다. 감사 로그 기록은 보존됩니다.`, () => {
        logAudit('delete', 'pharmacist', ph.id, `약사 ${ph.name} 삭제`);
        state.pharmacists = state.pharmacists.filter(p => p.id !== ph.id);
        saveState();
        render();
        toast('삭제되었습니다', 'success');
      });
    });
  }
}

function exportAuditCSV() {
  const rows = [['시각', '약사 ID', '약사명', '작업', '대상', '대상 ID', '상세']];
  state.auditLog.forEach(l => {
    rows.push([l.timestamp, l.pharmacistId || '', l.pharmacistName, l.action, l.target, l.targetId || '', l.details || '']);
  });
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const bom = '\ufeff'; // BOM for Excel Korean support
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `medit-audit-${today()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('감사 로그가 CSV로 내보내졌습니다', 'success');
}

/* ====================================================
   QR PATIENT PAIRING
   ==================================================== */
function openPatientPairing(pid) {
  const p = getPatient(pid);
  if (!p) return;

  // Find or create pairing
  let pairing = state.pairings.find(pr => pr.patientId === pid && new Date(pr.expiresAt) > new Date());
  if (!pairing) {
    // Generate 6-char human-readable code
    const code = Math.random().toString(36).slice(2, 8).toUpperCase();
    pairing = {
      code, patientId: pid,
      createdAt: new Date().toISOString(),
      expiresAt: new Date(Date.now() + 30 * 86400000).toISOString(), // 30 days
      pharmacistId: currentPharmacist()?.id,
    };
    state.pairings.push(pairing);
    logAudit('create', 'pairing', code, `${p.name} 환자용 QR 발급`);
    saveState();
  }

  // Build pairing URL
  // For demo: use location.href base + ?code=XXX, assumes medit-patient.html is in same dir
  const baseUrl = location.href.replace(/[^/]*$/, '') + 'medit-patient.html';
  const fullUrl = `${baseUrl}?code=${pairing.code}&name=${encodeURIComponent(p.name)}`;

  openModal(`
    <div class="modal-header">
      <div>
        <h3>환자 QR 페어링</h3>
        <div class="subtitle">${esc(p.name)} · 유효기간 ${formatDate(pairing.expiresAt)}</div>
      </div>
      <button class="modal-close" data-close><svg viewBox="0 0 24 24"><path d="M6 6 L18 18 M6 18 L18 6"/></svg></button>
    </div>
    <div class="modal-body">
      <p style="font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; line-height: 1.6;">
        환자 또는 보호자가 아래 QR을 스마트폰으로 촬영하면 복약 스케줄을 조회·체크할 수 있습니다.
        페어링 코드는 30일간 유효하며 감사 로그에 기록됩니다.
      </p>
      <div class="qr-wrap">
        <canvas id="qr-canvas"></canvas>
        <div class="qr-code-text">${esc(pairing.code)}</div>
      </div>
      <div class="field">
        <label>페어링 URL</label>
        <input type="text" id="qr-url" value="${esc(fullUrl)}" readonly onclick="this.select()">
        <div class="hint">환자의 문자·이메일로 이 URL을 공유하거나 QR을 인쇄하세요.</div>
      </div>
      <div class="warning-box yellow">
        <svg viewBox="0 0 24 24"><path d="M12 3 L22 20 L2 20 Z M12 10 L12 15 M12 17 L12 18"/></svg>
        <div><strong>참고</strong> — 데모 환경에서는 환자 페이지(<span class="mono">medit-patient.html</span>)가 같은 폴더에 있어야 합니다. 실운영 시에는 백엔드 연동이 필요합니다.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn danger" id="qr-revoke" style="margin-right: auto;">페어링 해제</button>
      <button class="btn" id="qr-copy">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M4 4 L16 4 M4 4 L4 16"/></svg>
        URL 복사
      </button>
      <button class="btn" data-close>닫기</button>
    </div>
  `);

  // Generate QR
  if (window.QRCode) {
    QRCode.toCanvas($('#qr-canvas'), fullUrl, { width: 200, margin: 1, color: { dark: '#00d2b4', light: '#ffffff' } });
  } else {
    $('#qr-canvas').outerHTML = '<div style="padding: 20px; color: var(--ink-muted); font-size: 12px;">QR 라이브러리 로드 실패. URL을 직접 공유하세요.</div>';
  }

  $('#qr-copy').addEventListener('click', () => {
    $('#qr-url').select();
    try { document.execCommand('copy'); toast('URL이 복사되었습니다', 'success'); }
    catch (e) { toast('복사 실패', 'error'); }
  });
  $('#qr-revoke').addEventListener('click', () => {
    closeModal();
    confirmDialog('페어링을 해제할까요?', '환자가 더 이상 이 코드로 접속할 수 없게 됩니다.', () => {
      logAudit('delete', 'pairing', pairing.code, `${p.name} 페어링 해제`);
      state.pairings = state.pairings.filter(pr => pr.code !== pairing.code);
      saveState();
      toast('페어링이 해제되었습니다', 'success');
    });
  });
}
